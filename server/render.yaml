# Deployment config for Render.com (free tier works for this project)
# Push this repo to GitHub, then in Render: New + > Blueprint > select this repo
services:
  - type: web
    name: shopli-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false        # set manually in Render dashboard (MongoDB Atlas URI)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CLIENT_URL
        sync: false         # set to your deployed frontend URL, e.g. https://shopli.vercel.app
      - key: NODE_ENV
        value: production
